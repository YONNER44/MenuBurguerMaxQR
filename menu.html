<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>BurguerMax — Menu Digital</title>
  <style>
    :root {
      --bg:       #0d0d0d;
      --bg-card:  #1a1a1a;
      --gold:     #F5C014;
      --gold-dim: #c99a00;
      --white:    #ffffff;
      --muted:    #888888;
      --border:   #2a2a2a;
      --red:      #e03030;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--white);
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      min-height: 100vh;
    }

    /* ── HEADER ── */
    header {
      background: #000;
      border-bottom: 3px solid var(--gold);
      padding: 10px 12px 8px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .logo-wrap { display: flex; align-items: center; justify-content: center; gap: 10px; }
    .logo-circle {
      width: 44px; height: 44px; border-radius: 50%;
      background: var(--gold);
      display: flex; align-items: center; justify-content: center;
      border: 2px solid #fff;
      flex-shrink: 0;
      overflow: hidden;
    }
    .logo-circle img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .brand { line-height: 1.1; text-align: left; }
    .brand-name  { font-size: clamp(1.1rem, 5vw, 2rem); font-weight: 900; color: var(--gold); letter-spacing: clamp(1px, 0.4vw, 3px); text-transform: uppercase; white-space: nowrap; }
    .brand-sub   { font-size: clamp(0.55rem, 1.8vw, 0.7rem); color: var(--muted); letter-spacing: clamp(1px, 0.3vw, 2px); text-transform: uppercase; margin-top: 2px; }

    /* ── SEARCH ── */
    .search-wrap { background: #000; padding: 10px 14px; }
    .search-input {
      width: 100%; background: #1a1a1a; border: 1px solid var(--border);
      border-radius: 8px; padding: 10px 16px; color: var(--white);
      font-size: 14px; outline: none; transition: border-color .2s;
    }
    .search-input::placeholder { color: var(--muted); }
    .search-input:focus { border-color: var(--gold); }

    /* ── CATEGORY NAV ── */
    .cat-nav {
      background: #080808; border-bottom: 1px solid var(--border);
      overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .cat-nav::-webkit-scrollbar { display: none; }
    .cat-inner { display: flex; gap: 6px; padding: 10px 12px; min-width: max-content; }
    .cat-btn {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 20px;
      color: var(--muted); padding: 7px 15px; font-size: 12px; cursor: pointer;
      white-space: nowrap; transition: all .2s; display: flex; align-items: center; gap: 5px;
      font-family: inherit;
    }
    .cat-btn.active { background: var(--gold); color: #000; border-color: var(--gold); font-weight: 700; }

    /* ── SECTION ── */
    .menu-section { padding: 0 12px 28px; }
    .sec-head {
      display: flex; align-items: center; gap: 10px;
      padding: 22px 4px 14px;
    }
    .sec-icon  { font-size: 1.4rem; }
    .sec-title { font-size: 1.35rem; font-weight: 900; color: var(--gold); text-transform: uppercase; letter-spacing: 2px; }
    .sec-line  { flex: 1; height: 1px; background: var(--border); }

    /* ── GRID ── */
    .menu-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 12px;
    }

    /* ── CARD ── */
    .card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column;
      transition: transform .2s, border-color .2s;
    }
    .card:hover { transform: translateY(-3px); border-color: var(--gold); }

    .card-img {
      height: 130px; display: flex; align-items: center; justify-content: center;
      font-size: 3.2rem; position: relative; overflow: hidden;
    }
    .card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; }
    .card-name { font-size: .92rem; font-weight: 700; color: var(--white); margin-bottom: 4px; line-height: 1.3; }
    .card-desc { font-size: .75rem; color: var(--muted); line-height: 1.45; flex: 1; margin-bottom: 10px; }
    .card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .card-price { font-size: 1.15rem; font-weight: 900; color: var(--gold); }
    .card-price::before { content: '$'; font-size: .8rem; opacity: .7; }

    .badge {
      font-size: .62rem; padding: 2px 8px; border-radius: 10px;
      font-weight: 700; text-transform: uppercase; white-space: nowrap;
    }
    .badge-red  { background: var(--red); color: #fff; }
    .badge-gold { background: var(--gold); color: #000; }

    /* ── NO RESULTS ── */
    .no-results { text-align: center; padding: 60px 20px; color: var(--muted); display: none; }
    .no-results-icon { font-size: 3rem; margin-bottom: 10px; }

    /* ── FOOTER ── */
    footer {
      background: #000; border-top: 2px solid var(--gold);
      padding: 22px 16px; text-align: center;
    }
    .foot-brand { font-size: 1.1rem; font-weight: 900; color: var(--gold); letter-spacing: 2px; }
    .foot-note  { font-size: .72rem; color: var(--muted); margin-top: 4px; }

    /* ── UTILITY ── */
    .hidden { display: none !important; }

    /* ── RESPONSIVE ── */
    @media (max-width: 480px) {
      .brand-name { font-size: 1.5rem; }
      .menu-grid  { grid-template-columns: 1fr 1fr; gap: 8px; }
      .card-img   { height: 95px; font-size: 2.2rem; }
      .card-body  { padding: 8px; }
      .card-name  { font-size: .78rem; }
      .card-desc  { font-size: .68rem; }
      .card-price { font-size: 1rem; }
    }
    @media (min-width: 600px) {
      header { padding: 14px 20px 12px; }
      .logo-circle { width: 54px; height: 54px; font-size: 26px; }
      .logo-wrap { gap: 14px; }
    }
    @media (min-width: 900px) {
      .menu-section { padding: 0 24px 36px; }
    }
  </style>
</head>

/* ══════════════════════════════════════════════
   RENDER
══════════════════════════════════════════════ */
function buildMenu() {
  const main = document.getElementById('menuMain');
  const catInner = document.getElementById('catInner');

  // ALL button
  catInner.innerHTML = '<button class="cat-btn active" onclick="showCat(\'all\',this)">🍽️ Todo</button>';

  MENU.forEach(cat => {
    // Category button
    const btn = document.createElement('button');
    btn.className = 'cat-btn';
    btn.textContent = cat.icon + ' ' + cat.title;
    btn.setAttribute('onclick', `showCat('${cat.id}',this)`);
    catInner.appendChild(btn);

    // Section
    const section = document.createElement('section');
    section.className = 'menu-section';
    section.dataset.cat = cat.id;

    section.innerHTML = `
      <div class="sec-head">
        <span class="sec-icon">${cat.icon}</span>
        <h2 class="sec-title">${cat.title}</h2>
        <div class="sec-line"></div>
      </div>
      <div class="menu-grid" id="grid-${cat.id}"></div>
    `;
    main.appendChild(section);

    const grid = section.querySelector('.menu-grid');

    cat.items.forEach(item => {
      const card = document.createElement('article');
      card.className = 'card';
      card.dataset.cat = cat.id;

      const badgeHtml = item.badge
        ? `<span class="badge ${item.badgeType || 'badge-gold'}">${item.badge}</span>`
        : '';

      card.innerHTML = `
        <div class="card-img" style="background:${cat.bg}">${cat.icon}</div>
        <div class="card-body">
          <div class="card-name">${item.name}</div>
          ${item.desc ? `<div class="card-desc">${item.desc}</div>` : '<div class="card-desc"></div>'}
          <div class="card-foot">
            <span class="card-price">${item.price}</span>
            ${badgeHtml}
          </div>
        </div>
      `;
      grid.appendChild(card);
    });
  });
}

/* ══════════════════════════════════════════════
   FILTROS
══════════════════════════════════════════════ */
function showCat(cat, btn) {
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value = '';

  document.querySelectorAll('.menu-section').forEach(s => {
    s.classList.toggle('hidden', cat !== 'all' && s.dataset.cat !== cat);
  });
  document.querySelectorAll('.card').forEach(c => c.classList.remove('hidden'));
  document.getElementById('noResults').style.display = 'none';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function filterMenu() {
  const q = document.getElementById('searchInput').value.toLowerCase().trim();
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('.cat-btn').classList.add('active');
  document.querySelectorAll('.menu-section').forEach(s => s.classList.remove('hidden'));

  if (!q) {
    document.querySelectorAll('.card').forEach(c => c.classList.remove('hidden'));
    document.getElementById('noResults').style.display = 'none';
    return;
  }

  let found = 0;
  document.querySelectorAll('.card').forEach(c => {
    const match = c.textContent.toLowerCase().includes(q);
    c.classList.toggle('hidden', !match);
    if (match) found++;
  });

  document.querySelectorAll('.menu-section').forEach(s => {
    const visible = s.querySelectorAll('.card:not(.hidden)').length;
    s.classList.toggle('hidden', visible === 0);
  });

  document.getElementById('noResults').style.display = found === 0 ? 'block' : 'none';
}

/* INIT */
buildMenu();
</script>
